# ABR-BOOT-001: boot straight into the Abraham kernel, no menu.
# Checked against CONFIG.md of Limine v12.9.6 on 2026-11-01.
# This is a template: tools/abr_boot_001.py replaces {KERNEL_BLAKE2B} with the BLAKE2b-512
# of the staged kernel, so Limine itself refuses a kernel that does not match.
timeout: 0
verbose: yes
serial: yes

/Abraham ABR-BOOT-001
    protocol: limine
    path: boot():/boot/abraham-kernel#{KERNEL_BLAKE2B}
